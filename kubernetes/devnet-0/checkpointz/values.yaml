  fullnameOverride: checkpointz
  replicas: 1

  image:
    repository: ethpandaops/checkpointz
    tag: daisugi-support
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 64m
      memory: 256Mi
  ingress:
    enabled: true
    className: traefik-devnets
    annotations:
      ethpandaops.io/exposure: "public"
      traefik.ingress.kubernetes.io/router.middlewares: traefik-devnets-pandamenu@kubernetescrd
    hosts:
      - host: checkpoint-sync.daisugi-devnet-0.ethpandaops.io
        paths:
          - path: /
            pathType: Prefix


  config:
    global:
      listenAddr: ":5555"
      logging: "info" # panic,fatal,warm,info,debug,trace
      metricsAddr: ":9090"

    checkpointz:
      mode: full
      caches:
        blocks:
          max_items: 100
        states:
          max_items: 5
      historical_epoch_count: 20

